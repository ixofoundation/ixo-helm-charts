apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ixo-supamoto-3cx-server.fullname" . }}-config
  labels:
    {{- include "ixo-supamoto-3cx-server.labels" . | nindent 4 }}
data:
  production.yaml: |-
    # -------------------------------------------------------------------------------------------------
    # 3CX REST API CONFIG
    # -------------------------------------------------------------------------------------------------
    threecx:
      pbxUrl: '<path:ixo_core/data/ixo-supamoto-3cx-server#3CX_BASE_URL>'
      clientId: '<path:ixo_core/data/ixo-supamoto-3cx-server#3CX_CLIENT_ID>'
      clientSecret: '<path:ixo_core/data/ixo-supamoto-3cx-server#3CX_CLIENT_SECRET>'
      pageSize: 100
      maxRetries: 4

    # -------------------------------------------------------------------------------------------------
    # INGESTION CONFIG
    # -------------------------------------------------------------------------------------------------
    ingestion:
      # Cron expression for the CDR-polling job (UTC). Default: every 10 minutes.
      cronSchedule: '*/10 * * * *'
      # When true, the cron job ticks but skips 3CX polling.
      skipPollCdrs: false
      overlapSeconds: 86400

    # -------------------------------------------------------------------------------------------------
    # CHAIN CONFIG
    # -------------------------------------------------------------------------------------------------
    resolver:
      url: 'https://resolver.testnet.ixo.earth/1.0/identifiers/'
    rpc:
      url: 'https://testnet.ixo.earth/rpc/'
    remoteContexts:
      - 'https://w3id.org/ixo/context/v1'

    # -------------------------------------------------------------------------------------------------
    # CLAIM SUBMISSION CONFIG
    # -------------------------------------------------------------------------------------------------
    claimCollectionId: '3928'

    # -------------------------------------------------------------------------------------------------
    # CREDENTIALS CONFIG
    # -------------------------------------------------------------------------------------------------
    contributor:
      mnemonic: '<path:ixo_core/data/ixo-supamoto-3cx-server#CONTRIBUTOR_MNEMONIC>' # <- sensitive
      did: 'did:ixo:ixo1p333qt6lc2qs7h3wyadskupq0t3v2uht8suf3g'
      # Ed25519 signer mnemonic (VC signing) — paste the ed signer linked to the
      # contributor account; empty falls back to deriving from `mnemonic`.
      edMnemonic: '<path:ixo_core/data/ixo-supamoto-3cx-server#CONTRIBUTOR_ED_MNEMONIC>'
    evaluator:
      mnemonic: '<path:ixo_core/data/ixo-supamoto-3cx-server#EVALUATOR_MNEMONIC>' # <- sensitive
      did: 'did:ixo:ixo1pshkr26kml70cut5zkvjmsmenyv8r9rk6ur3yj'

    # -------------------------------------------------------------------------------------------------
    # CLAIMS BOT CONFIG (matrix-supamoto-bot REST API — POST /action)
    # -------------------------------------------------------------------------------------------------
    claimsBot:
      url: 'https://claim.bot.testmx.ixo.earth/'
      accessToken: '<path:ixo_core/data/ixo-supamoto-3cx-server#CLAIMS_BOT_ACCESS_TOKEN>' # <- sensitive

    # -------------------------------------------------------------------------------------------------
    # DATABASE CONFIG
    # -------------------------------------------------------------------------------------------------
    databaseUrl: '<path:ixo_core/data/ixo-supamoto-3cx-server#DATABASE_URL>'
    databaseUseSsl: true
    migrateDbProgrammatically: true

    # -------------------------------------------------------------------------------------------------
    # REST API CONFIG
    # -------------------------------------------------------------------------------------------------
    restApi:
      enabled: true
      port: 8080
      trustProxy: 1
      adminToken: '<path:ixo_core/data/ixo-supamoto-3cx-server#REST_ADMIN_TOKEN>' # <- sensitive

