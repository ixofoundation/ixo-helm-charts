{{- $mountPath := .Values.persistentVolume.mountPath | default "/data" }}
{{- $chartEnv := list "PORT" "DATA_DIR" "MATRIX_STORE_PATH" "METRICS_PORT" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memory-engine-graphiti.memoryEngineFullname" . }}
  labels:
    {{- include "memory-engine-graphiti.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-engine
  {{- if and .Values.externalSecret .Values.externalSecret.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "memory-engine-graphiti.memoryEngineSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "memory-engine-graphiti.memoryEngineSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: memory-engine
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "memory-engine-graphiti.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.containers.memoryEngine.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if (.Values.containers.memoryEngine.fixVolumeOwnership | default dict).enabled }}
      # Files the previous pod left behind as root (anything written after the
      # volume was chowned to gid 1000) must be group-writable before the
      # uid-1000 engine starts; the kubelet's OnRootMismatch pass skips a
      # volume whose root already matches. Incremental: only mismatches change.
      initContainers:
        - name: fix-volume-ownership
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              d={{ $mountPath | quote }}
              # Every start of the hardened engine runs as uid 1000 (USER node in
              # the image, runAsUser in the chart) and its first boot creates
              # $d/spaces/.engine-booted as that user. Once that file is owned by
              # 1000, nothing has written to the volume as root since the
              # handover, so the walk is skipped: cold, it costs ~100 inodes/s on
              # HDD block storage (25 min for devnet's 141k entries). Set
              # fixVolumeOwnership.force to walk anyway (files restored as root
              # from outside the pod).
              force={{ .Values.containers.memoryEngine.fixVolumeOwnership.force | default false | quote }}
              if [ "$force" != "true" ] && [ "$(stat -c %u "$d/spaces/.engine-booted" 2>/dev/null)" = "1000" ]; then
                echo "last engine start was uid 1000; nothing to fix"
                exit 0
              fi
              find "$d" ! -group 1000 -exec chgrp 1000 {} +
              find "$d" -type d ! -perm -070 -exec chmod g+rwx {} +
              find "$d" -type d ! -perm -2000 -exec chmod g+s {} +
              find "$d" -type f ! -perm -060 -exec chmod g+rw {} +
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
              add:
              - CHOWN
              - FOWNER
              - DAC_OVERRIDE
              - DAC_READ_SEARCH
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: storage
              mountPath: {{ $mountPath }}
      {{- end }}
      containers:
        - name: memory-engine
          securityContext:
            {{- toYaml .Values.containers.memoryEngine.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and .Values.externalSecret .Values.externalSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "memory-engine-graphiti.fullname" . }}-env
          {{- end }}
          env:
            {{- range .Values.containers.memoryEngine.env }}
            {{- if not (has .name $chartEnv) }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
            {{- end }}
            {{- range .Values.env }}
            {{- if not (has .name $chartEnv) }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
            {{- end }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: DATA_DIR
              value: {{ printf "%s/spaces" $mountPath | quote }}
            - name: MATRIX_STORE_PATH
              value: {{ printf "%s/matrix-store" $mountPath | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            # Metrics only: no Service port, no ingress.
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # Liveness stays on the trivial /healthcheck: a restart is a SIGKILL
          # risk for the kuzu WAL, so it only fires on a stuck event loop
          # (6 x 30 s). Readiness reflects real state (shutting down, startup
          # scan not finished, disk) and only removes the pod from the Service.
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthcheck/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.containers.memoryEngine.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: {{ $mountPath }}
            # readOnlyRootFilesystem: Node and tar/gzip need a writable /tmp.
            - name: tmp
              mountPath: /tmp
            # The Matrix client's logger (@ixo/logger via @ixo/matrix) opens
            # logs/error.log and logs/combined.log relative to the working
            # directory, /app. On a read-only root filesystem that mkdir fails
            # and the Matrix client never initialises: memory events are then
            # not logged to rooms. The files duplicate stdout; they are
            # ephemeral on purpose.
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "memory-engine-graphiti.memoryEngineFullname" . }}-storage
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir:
            # winston writes without rotation; the cap protects the node's
            # ephemeral storage (the pod is evicted and restarted at the cap).
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
