apiVersion: v1
kind: Service
metadata:
  name: {{ include "memory-engine-graphiti.fullname" . }}
  labels:
    {{- include "memory-engine-graphiti.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    # memory-engine-ts serves MCP at /mcp on the same container port.
    - port: {{ .Values.service.portMcp }}
      targetPort: http
      protocol: TCP
      name: mcp
  selector:
    {{- include "memory-engine-graphiti.memoryEngineSelectorLabels" . | nindent 4 }}
