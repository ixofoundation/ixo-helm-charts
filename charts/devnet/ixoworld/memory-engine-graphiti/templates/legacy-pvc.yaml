{{- if .Values.legacy.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-storage
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-storage
  annotations:
    # Keep the legacy data around for migration even after legacy.enabled=false.
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes:
{{- .Values.legacy.persistentVolume.accessModes | toYaml | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.legacy.persistentVolume.size }}
  storageClassName: {{ .Values.legacy.persistentVolume.storageClass }}
{{- end }}
