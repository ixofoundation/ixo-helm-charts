# Default values for memory-engine-graphiti (memory-engine-ts).
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# memory-engine-ts keeps kuzu/SQLite files on its PVC, which are single-writer:
# run exactly one replica with the Recreate strategy.
replicaCount: 1
strategy:
  type: Recreate
image:
  repository: ghcr.io/ixoworld/memory-engine-graphiti-memory-engine-ts
  pullPolicy: IfNotPresent
  # tag defaults to Chart.AppVersion (bumped by the memory-engine-ts CI on develop).
  tag: ""
containers:
  memoryEngine:
    # The single memory knob. requests == limits: a kill (container OOM or
    # node-pressure eviction) is a SIGKILL, and a SIGKILL inside a commit tears
    # the space's kuzu write-ahead log, so this pod must never be the first one
    # the kubelet reclaims from. With request == limit the pod can never be over
    # its request, which is what eviction ranks on.
    # QoS is Burstable, not Guaranteed, on purpose: Guaranteed also needs a CPU
    # limit, and a CPU limit would throttle gzip, cognify post-processing and
    # search ranking (devnet pod sees 3 CPUs). If you ever add one, set it equal
    # to the CPU request or the class stays Burstable.
    #
    # MAX_OPEN_SPACES (env below) is documented against THIS limit:
    #   MAX_OPEN_SPACES <= (limit_MiB - 700) / 150
    # ~700 MB baseline + ~150 MB per open space (README "Running it": 100-150 MB).
    # At 3Gi: (3072 - 700) / 150 = 15.8, so the ceiling is 15; 12 is the live
    # devnet value, which leaves room for a space that grows while open and for the
    # biggest space (~1.1 GB above baseline); a full pool evicts an idle space
    # before opening another.
    # Change the limit and MAX_OPEN_SPACES together, never one alone.
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        memory: 3Gi
    # Engine-only settings. They live here (not in the top-level `env`,
    # `podSecurityContext` and `securityContext`) because the legacy python
    # Deployments (rollback path, rendered at 0 replicas) read those top-level
    # keys too, and must keep running as root with a writable root filesystem.
    #
    # PORT, DATA_DIR, MATRIX_STORE_PATH and METRICS_PORT are set by the chart (from
    # service.port, persistentVolume.mountPath and metrics.port); entries with
    # those names here are ignored. Explicit entries here WIN over the Vault-backed
    # secret (externalSecret/envFrom) on the same name, so a value set here
    # replaces whatever Vault holds for it. APP_VERSION and GIT_SHA are baked into
    # the image and are deliberately not set here. The top-level `env` is still
    # appended after this list for compatibility.
    env:
    # Pool size, sized against the memory limit above:
    #   MAX_OPEN_SPACES <= (limit_MiB - 700) / 150   (3Gi -> ceiling 15, 12 used).
    # The engine default is 64, which at ~150 MB per space is ~10 GB: more than the limit.
    - name: MAX_OPEN_SPACES
      value: "12"
    # Concurrent ingest (cognify) batches across spaces.
    - name: INGEST_CONCURRENCY
      value: "4"
    # libuv threadpool (fs, gzip, crypto): Node's default of 4 serialises snapshot
    # and tar work behind each other.
    - name: UV_THREADPOOL_SIZE
      value: "16"
    - name: LOG_LEVEL
      value: info
    # The image runs as USER node (uid 1000, gid 1000). /data is a PVC that today
    # holds root-owned files, so fsGroup makes the kubelet chown it to gid 1000, and
    # OnRootMismatch limits that to one recursive pass (skipped once the volume root
    # is already owned by 1000). Without it the non-root process cannot write the
    # existing spaces.
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    # The app writes only under /data (the PVC), /tmp and /app/logs (emptyDirs,
    # see the deployment template); everything else is read-only.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    # Before every start, an init container (root, with only the CHOWN/FOWNER/
    # DAC capabilities) makes whatever the previous pod left behind writable
    # for gid 1000: files a root pod wrote after the volume was handed over,
    # which the kubelet's OnRootMismatch pass no longer touches. Incremental
    # finds over the volume; seconds on 150k files. Same as testnet/mainnet.
    fixVolumeOwnership:
      enabled: true
      # true = walk the volume at every start even when the engine's boot marker
      # is owned by uid 1000 (files restored as root from outside the pod).
      force: false  # Legacy python containers — only used by the legacy Deployment (see `legacy` below).
  worker:
    image: ghcr.io/ixoworld/memory-engine-graphiti-community-worker
    resources: {}
  apiServer:
    image: ghcr.io/ixoworld/memory-engine-graphiti-api-server
    resources: {}
  mcpServer:
    image: ghcr.io/ixoworld/memory-engine-graphiti-mcp-server
    resources: {}
imagePullSecrets: []
# PORT, DATA_DIR and MATRIX_STORE_PATH are set by the chart (from service.port and
# persistentVolume.mountPath); entries with those names here are ignored by the
# memory-engine-ts container.
env: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
# Prometheus scrape annotations (prometheus.io/scrape, prometheus.io/port) are
# added to the memory-engine pod by its template from metrics.port; entries here
# are merged after them (and also apply to the legacy Deployment).
podAnnotations: {}
# Shared with the legacy python Deployments: leave empty. The memory-engine
# security context is containers.memoryEngine.podSecurityContext / .securityContext.
podSecurityContext: {}
securityContext: {}
# Metrics endpoint served by the engine on its own port (not the REST/MCP port).
# Exposed as the named container port `metrics` and scraped by pod annotation;
# no Service port and no ingress, so it is reachable inside the cluster only.
# The same value is passed to the engine as METRICS_PORT.
metrics:
  port: 9464
# Prometheus alerts for the memory-engine container (templates/prometheusrule.yaml):
# working set near the memory limit (warning) and OOMKilled restarts (critical).
# The rule carries the `release` label the cluster's kube-prometheus-stack
# ruleSelector matches.
alerts:
  enabled: true
  prometheusRelease: kube-prometheus-stack
  # Working set / limit above which the warning fires, after `nearLimitFor`.
  nearLimitRatio: 0.85
  nearLimitFor: 10m

# Graceful shutdown: stop new ingest batches, close the listener (10s), let the
# in-flight cognify finish (up to 120s — a 25-message batch measured 77s),
# write the registries, flush dirty owner copies (45s), release handles. A
# SIGKILL inside a commit tears the space's kuzu write-ahead log, so the
# grace period is sized from that sum, not from the flush alone.
terminationGracePeriodSeconds: 200
service:
  type: ClusterIP
  # REST and MCP (/mcp) are served on this single container port.
  port: 3200
  # Extra service port kept for the MCP ingress / existing in-cluster callers;
  # it targets the same container port as `port`.
  portMcp: 8080
ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
  - host: chart-example.local
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
ingressMcp:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
  - host: chart-example.local
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
# VerticalPodAutoscaler (VPA) support for the memory-engine-ts Deployment.
# Requires the VPA CRDs/controller installed in the cluster:
# https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
# Disabled by default. When enabled with updateMode "Off" (the default), the VPA
# only produces resource recommendations (visible via `kubectl describe vpa`) and
# never mutates or evicts running pods.
# MUST stay "Off" (or "Initial"). Auto/Recreate evict the pod to apply
# recommendations, and an eviction is a SIGKILL that can tear a space's kuzu WAL.
# Also note that VPA would fight the requests == limits setting above.
verticalPodAutoscaler:
  enabled: false
  # "Off" = recommendations only (safe default). Other options: "Initial", "Recreate", "Auto".
  updateMode: "Off"
  # Optional per-container resource policies, e.g.:
  # resourcePolicy:
  #   containerPolicies:
  #     - containerName: 'memory-engine'
  #       minAllowed:
  #         cpu: 100m
  #         memory: 128Mi
  #       maxAllowed:
  #         cpu: 2
  #         memory: 4Gi
  resourcePolicy: {}
nodeSelector: {}
tolerations: []
affinity: {}
# memory-engine-ts storage (its own PVC, separate from the legacy ones).
# DATA_DIR=<mountPath>/spaces, MATRIX_STORE_PATH=<mountPath>/matrix-store.
#
# Sizing: size >= spaces x p50 space size x 1.5 + 2 x largest space x 1.5 + 20 %
# (the middle term is the headroom for two concurrent owner-copy flushes of the
# largest space: a snapshot copy plus its gzip each; quarantined copies live on
# the same volume too). Measured on devnet: 111 spaces, typical 3-40 MB, the
# largest 4.3 GB before compaction.
# At 40Gi the byte ceiling is roughly 1,500-2,000 median spaces.
#
# DECISION (flagged, not made here): storage class and size per environment.
# vultr-block-storage-hdd is HDD-class; cold opens (36 s for the largest space),
# kuzu WAL, LanceDB fragments and snapshot copies are all disk-bound on it. The
# review recommends the SSD/NVMe class. The exact Vultr class name is UNVERIFIED
# here: check `kubectl get storageclass` before putting a name in.
# storageClassName is immutable on an existing PVC, so changing it needs a new
# volume plus a data copy, not a values edit.
# Growing `size` in place only works if the storage class has
# allowVolumeExpansion: true (verify with `kubectl get sc <class> -o yaml`).
persistentVolume:
  mountPath: /data
  size: 40Gi
  accessModes:
  - ReadWriteOnce
  storageClass: vultr-block-storage-hdd
# Legacy python stack (worker/api-server/mcp-server Deployment) and matrix-bridge-api,
# kept rendered at 0 replicas so their PVCs stay bound and data can be migrated
# into the memory-engine-ts PVC. Both legacy PVCs carry Prune=false, so they
# survive `legacy.enabled: false` and have to be deleted by hand once migrated.
legacy:
  enabled: true
  # Set to 1 to roll back to the python stack (and matrix-bridge-api.replicaCount).
  replicaCount: 0
  image:
    tag: "main-2ad8596"
  persistentVolume:
    # Mount path for main containers (MATRIX_BOT_STORE_PATH).
    mountPath: /storage/matrix_bot_store
    size: 40Gi
    accessModes:
    - ReadWriteOnce
    storageClass: vultr-block-storage-hdd
# Legacy Matrix Bridge API — rendered only when legacy.enabled and enabled here.
# Replaced by memory-engine-ts (Matrix logging and UCAN are native there).
matrix-bridge-api:
  enabled: false
  replicaCount: 0
  image:
    repository: ghcr.io/ixoworld/memory-engine-graphiti
    pullPolicy: IfNotPresent
    tag: v1.3.1
  port: 3100
  env: []
  resources: {}
  persistentVolume:
    mountPath: /storage/matrix_bridge_store
    size: 40Gi
    accessModes:
    - ReadWriteOnce
    storageClass: vultr-block-storage-hdd
  verticalPodAutoscaler:
    enabled: false
    updateMode: "Off"
    resourcePolicy: {}
# Sync a whole Vault KV path into a Secret (via external-secrets-operator) and
# expose every key as an env var through envFrom. Explicit env entries win on
# key collisions. Requires the "vault" ClusterSecretStore and reloader.
externalSecret:
  enabled: false
  vaultPath: ""
  refreshInterval: 1m
  storeName: vault
