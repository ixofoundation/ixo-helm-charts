# Default values for ixo-firecrawler.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

strategy:
  type: Recreate

# Sub-chart overrides
# Each sub-chart has its own Chart.yaml with appVersion that CI/CD can update
# The deployment will use: {{ .Subcharts.CHARTNAME.Chart.AppVersion }} as the image tag

api-server:
  replicaCount: 1  # override top-level replicaCount for API deployment
  image:
    repository: ghcr.io/firecrawl/firecrawl
    pullPolicy: IfNotPresent
    # tag defaults to api-server Chart.AppVersion
  # Stock upstream Firecrawl, pinned by tag AND digest (2.11.728 = upstream commit 404a5796).
  # Wins over api-server.image: the mainnet Argo values (Terraform) still pin
  # image.repository to the old fork ghcr.io/ixoworld/firecrawel and pullPolicy Always.
  # The tag lives here, not in charts/api-server/Chart.yaml, because the fork's CI
  # rewrites that appVersion on every push. Bump by hand after testing; never "latest".
  imageOverride:
    repository: ghcr.io/firecrawl/firecrawl
    tag: "2.11.728@sha256:d4fab5486d9b1a1a14f9b6aa88a5311e45fd28962c60e0c74143e4402ef5c59a"
    pullPolicy: IfNotPresent
  # Appended after api-server.env (which the Argo values override replaces wholesale).
  # A name must not appear in both: the render fails on a duplicate. To change a value
  # that api-server.env already sets (e.g. SEARXNG_ENGINES), change it at its source (Vault).
  extraEnv: []
  # Stock routes (apps/api/src/controllers/health.ts); they answer once the API process listens.
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: api
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: api
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  resources: {}
    # limits:
    #   cpu: 1000m
    #   memory: 2Gi
    # requests:
    #   cpu: 500m
    #   memory: 1Gi
  env: []
    # - name: HOST
    #   value: "0.0.0.0"
    # - name: PORT
    #   value: "3002"
    # - name: INTERNAL_PORT
    #   value: "3002"
    # - name: EXTRACT_WORKER_PORT
    #   value: "3004"
    # - name: WORKER_PORT
    #   value: "3005"
    # - name: USE_GO_MARKDOWN_PARSER
    #   value: "true"
    # - name: ENV
    #   value: "production"
    # - name: REDIS_URL
    #   value: "redis://redis:6379"
    # - name: REDIS_RATE_LIMIT_URL
    #   value: "redis://redis:6379"
    # PLAYWRIGHT_MICROSERVICE_URL, and with rabbitmq.enabled NUQ_RABBITMQ_URL + RABBITMQ_PASSWORD,
    # are set by the chart; do not repeat them here (the render fails on a duplicate name).
    # - name: NUQ_DATABASE_URL
    #   value: "postgres://postgres:postgres@nuq-postgres:5432/postgres"
    # - name: USE_DB_AUTHENTICATION
    #   value: "false"
    # - name: OPENAI_API_KEY
    #   value: ""
    # - name: OPENAI_BASE_URL
    #   value: "https://openrouter.ai/api/v1"
    # - name: MODEL_NAME
    #   value: ""
    # - name: OPENROUTER_API_KEY
    #   value: ""
    # - name: LLM_PROVIDER
    #   value: "openrouter"
    # - name: VLM_MODEL_NAME
    #   value: ""
    # - name: IXO_API_KEY
    #   value: "none"
    # - name: EMBEDDING_PROVIDER
    #   value: "ixo"
    # - name: IXO_BASE_URL
    #   value: "https://nomic.testnet.ixo.earth/v1"
    # - name: BULL_AUTH_KEY
    #   value: ""

mcp-server:
  image:
    repository: ghcr.io/firecrawl/firecrawl-mcp-server
    pullPolicy: IfNotPresent
    # tag defaults to mcp-server Chart.AppVersion (pinned tag@digest there)
  # /health is exempt from the MCP host allowlist (answers 200 to the kubelet's pod-IP Host).
  readinessProbe:
    httpGet:
      path: /health
      port: mcp
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /health
      port: mcp
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 1Gi
    # requests:
    #   cpu: 250m
    #   memory: 512Mi
  env: []
    # - name: FIRECRAWL_API_KEY
    #   value: "no-auth-required"
    # - name: FIRECRAWL_API_URL
    #   value: "http://localhost:3002"
    # - name: HTTP_STREAMABLE_SERVER
    #   value: "true"
    # - name: HTTP_STREAMABLE_HOST
    #   value: "0.0.0.0"
    # - name: HOST
    #   value: "0.0.0.0"
    # - name: PORT
    #   value: "3000"

playwright-service:
  replicaCount: 1  # override top-level replicaCount for Playwright deployment
  image:
    repository: ghcr.io/firecrawl/playwright-service
    pullPolicy: IfNotPresent
    # tag defaults to playwright-service Chart.AppVersion (pinned tag@digest there)
  readinessProbe:
    httpGet:
      path: /health
      port: playwright
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /health
      port: playwright
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  resources: {}
    # limits:
    #   cpu: 1000m
    #   memory: 2Gi
    # requests:
    #   cpu: 500m
    #   memory: 1Gi
  env: []
    # FIRECRAWL_API_URL is set automatically to the in-cluster API service URL; override here if needed
    # - name: PORT
    #   value: "3000"
    # - name: PROXY_SERVER
    #   value: ""
    # - name: PROXY_USERNAME
    #   value: ""
    # - name: PROXY_PASSWORD
    #   value: ""
    # - name: BLOCK_MEDIA
    #   value: ""

# RabbitMQ for NuQ (stock Firecrawl's harness requires NUQ_RABBITMQ_URL in Kubernetes).
# Same version as upstream's compose/Helm example (rabbitmq:3-management = 3.13.7);
# the non-management variant: the management UI/HTTP API is not used.
rabbitmq:
  enabled: true
  image: "docker.io/library/rabbitmq:3.13.7@sha256:87178a0ee3e2f52980ba356d38646ed1056705ff2d5ff281f8965456eaa0c1e3"
  pullPolicy: IfNotPresent
  port: 5672
  username: firecrawl
  # Resolved by argocd-vault-plugin at render time; the key must exist in Vault before
  # this chart syncs, or the render fails and Argo leaves the running pods untouched.
  # Use a URL-safe value (e.g. openssl rand -hex 24): it is embedded in NUQ_RABBITMQ_URL.
  password: "<path:ixo_core/data/ixo-firecrawl#RABBITMQ_PASSWORD>"
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  # API Server port
  apiPort: 3002
  # MCP Server port
  mcpPort: 8030
  # Playwright Service port (used internally by API)
  playwrightPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          service: api
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# PodDisruptionBudget to prevent descheduler (e.g. LowNodeUtilization) from evicting the pod
pdb:
  enabled: false
  # minAvailable: 1 ensures at least one pod stays running (use for single-replica or critical workloads)
  minAvailable: 1
  # maxUnavailable: use instead of minAvailable if you prefer "at most N pods down" (mutually exclusive with minAvailable)
  # maxUnavailable: 0

# VerticalPodAutoscaler (VPA) support.
# Requires the VPA CRDs/controller installed in the cluster:
# https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
# Disabled by default. When enabled with updateMode "Off" (the default), the VPA
# only produces resource recommendations (visible via `kubectl describe vpa`) and
# never mutates or evicts running pods. Creates one VPA per Deployment (api, mcp, playwright).
verticalPodAutoscaler:
  enabled: false
  # "Off" = recommendations only (safe default). Other options: "Initial", "Recreate", "Auto".
  updateMode: "Off"
  # Optional per-container resource policies, e.g.:
  # resourcePolicy:
  #   containerPolicies:
  #     - containerName: '*'
  #       minAllowed:
  #         cpu: 100m
  #         memory: 128Mi
  #       maxAllowed:
  #         cpu: 2
  #         memory: 4Gi
  resourcePolicy: {}

nodeSelector: {}

# tolerations: # Requires a node with the taint "dedicated=bigmem:NoSchedule", kubectl taint nodes <node> dedicated=bigmem:NoSchedule
#   - key: "dedicated"
#     operator: "Equal"
#     value: "bigmem"
#     effect: "NoSchedule"

affinity: {}

