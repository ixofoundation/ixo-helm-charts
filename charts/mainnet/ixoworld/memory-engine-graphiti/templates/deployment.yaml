{{- $mountPath := .Values.persistentVolume.mountPath | default "/data" }}
{{- $chartEnv := list "PORT" "DATA_DIR" "MATRIX_STORE_PATH" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memory-engine-graphiti.memoryEngineFullname" . }}
  labels:
    {{- include "memory-engine-graphiti.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-engine
  {{- if and .Values.externalSecret .Values.externalSecret.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "memory-engine-graphiti.memoryEngineSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "memory-engine-graphiti.memoryEngineSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: memory-engine
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "memory-engine-graphiti.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: memory-engine
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and .Values.externalSecret .Values.externalSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "memory-engine-graphiti.fullname" . }}-env
          {{- end }}
          env:
            {{- range .Values.env }}
            {{- if not (has .name $chartEnv) }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
            {{- end }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: DATA_DIR
              value: {{ printf "%s/spaces" $mountPath | quote }}
            - name: MATRIX_STORE_PATH
              value: {{ printf "%s/matrix-store" $mountPath | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.containers.memoryEngine.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: {{ $mountPath }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "memory-engine-graphiti.memoryEngineFullname" . }}-storage
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
